<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFT Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:#111}.top{background:#111;color:#fff;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:10}.top h1{font-size:20px;margin:0}.top button{border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer}.wrap{width:min(1320px,96%);margin:22px auto}.msg{padding:18px;background:#fff;border:1px solid #ddd;border-radius:10px;line-height:1.5}.error{border-color:#efbbbb;background:#fff0f0;color:#8d0000}.section{background:#fff;border:1px solid #ddd;border-radius:10px;margin-bottom:18px;overflow:hidden}.section h2{margin:0;padding:14px 16px;background:#111;color:#fff;font-size:17px}.tools{padding:12px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd}.tools input,.tools select{padding:9px;border:1px solid #bbb;border-radius:6px;min-width:180px}.tools button{padding:9px 14px;border:0;border-radius:6px;background:#5b922b;color:#fff;font-weight:700;cursor:pointer}.tablebox{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{border-bottom:1px solid #e4e4e4;padding:10px;text-align:left;font-size:13px;vertical-align:middle}th{background:#eee}.status{font-weight:800}.pending{color:#a45d00}.approved{color:green}.rejected,.revoked{color:#b00020}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;border-radius:5px;padding:7px 10px;font-weight:800;cursor:pointer}.approve{background:#5b922b;color:white}.reject{background:#b00020;color:white}.revoke{background:#555;color:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}.card{background:#f7f7f7;border:1px solid #ddd;border-radius:8px;padding:12px}.card b{display:block;font-size:25px;margin-top:4px}.pass{color:green;font-weight:800}.fail{color:#b00020;font-weight:800}@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="top"><h1>Miraisen JFT Mock Test — Admin</h1><div><span id="adminEmail" style="font-size:12px;margin-right:10px"></span><button id="logoutBtn">Logout</button></div></div>
<div class="wrap"><div id="status" class="msg">Admin permission जाँच हुँदैछ...</div><div id="dashboard" style="display:none">
<section class="section"><h2>Student Access Requests</h2><div class="tools"><input id="userSearch" placeholder="Search name or Gmail"><select id="userStatus"><option value="">All Status</option><option value="pending">PENDING</option><option value="approved">APPROVED</option><option value="rejected">REJECTED</option><option value="revoked">REVOKED</option></select><button id="refreshUsers">Refresh Requests</button></div><div class="tablebox"><table><thead><tr><th>Requested</th><th>Name</th><th>Email</th><th>Status</th><th>Approved/Updated</th><th>Action</th></tr></thead><tbody id="usersBody"></tbody></table></div></section>
<section class="section"><h2>Mock Test Attempts</h2><div class="cards"><div class="card">Attempts<b id="totalAttempts">0</b></div><div class="card">Unique Gmail<b id="uniqueUsers">0</b></div><div class="card">Passed<b id="passed">0</b></div><div class="card">Failed<b id="failed">0</b></div></div><div class="tools"><input id="attemptSearch" placeholder="Search name or Gmail"><select id="resultFilter"><option value="">PASS + FAIL</option><option>PASS</option><option>FAIL</option></select><button id="refreshAttempts">Refresh Attempts</button><button id="csvBtn">Export CSV</button></div><div class="tablebox"><table><thead><tr><th>Date/Time</th><th>Name</th><th>Email</th><th>Test</th><th>Score</th><th>%</th><th>Result</th><th>Correct</th><th>Wrong</th><th>Unanswered</th><th>Duration</th></tr></thead><tbody id="attemptsBody"></tbody></table></div></section>
</div></div>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);let auth,db,ADMIN_EMAIL='miraisen2657@gmail.com',users=[],attempts=[];
function fail(e){$('status').className='msg error';$('status').innerHTML='<b>Admin setup/login error</b><br>'+esc(e&&e.message||e)+'<br><br><a href="login.html">Login page मा फर्कनुहोस्</a>';}
function extractObject(t,n){const m=t.match(new RegExp('export\\s+const\\s+'+n+'\\s*=\\s*({[\\s\\S]*?})\\s*;'));if(!m)throw new Error(n+' firebase-config.js मा भेटिएन।');return Function('"use strict";return ('+m[1]+')')();}
function extractString(t,n,f){const m=t.match(new RegExp('export\\s+const\\s+'+n+'\\s*=\\s*["\\\']([^"\\\']+)["\\\']'));return m?m[1]:f;}
async function init(){try{if(location.protocol==='file:')throw new Error('admin.html लाई http://localhost:5500 बाट खोल्नुहोस्।');if(typeof firebase==='undefined')throw new Error('Firebase SDK load भएन। Internet जाँच्नुहोस्।');const r=await fetch('./firebase-config.js',{cache:'no-store'});if(!r.ok)throw new Error('firebase-config.js load हुन सकेन।');const t=await r.text(),cfg=extractObject(t,'firebaseConfig');ADMIN_EMAIL=extractString(t,'ADMIN_EMAIL',ADMIN_EMAIL);if(!cfg.apiKey||String(cfg.apiKey).includes('PASTE_'))throw new Error('firebase-config.js मा वास्तविक Firebase config राखिएको छैन।');if(!firebase.apps.length)firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async user=>{if(!user){location.href='login.html';return;}$('adminEmail').textContent=user.email||'';if(String(user.email||'').toLowerCase()!==ADMIN_EMAIL.toLowerCase()){fail(new Error('Admin access केवल '+ADMIN_EMAIL+' का लागि हो।'));return;}$('status').style.display='none';$('dashboard').style.display='block';await Promise.all([loadUsers(),loadAttempts()]);});}catch(e){fail(e);}}
$('logoutBtn').onclick=async()=>{try{if(auth)await auth.signOut();}finally{location.href='login.html';}};$('refreshUsers').onclick=loadUsers;$('refreshAttempts').onclick=loadAttempts;$('userSearch').oninput=renderUsers;$('userStatus').onchange=renderUsers;$('attemptSearch').oninput=renderAttempts;$('resultFilter').onchange=renderAttempts;$('csvBtn').onclick=exportCsv;
async function loadUsers(){$('refreshUsers').disabled=true;try{const s=await db.collection('users').limit(1000).get();users=s.docs.map(d=>({id:d.id,...d.data()}));users.sort((a,b)=>toMs(b.requestedAt)-toMs(a.requestedAt));renderUsers();}catch(e){alert('Access requests load failed: '+(e.message||e)+'\n\nFirestore Rules Publish गरिएको छ कि छैन जाँच्नुहोस्।');}finally{$('refreshUsers').disabled=false;}}
function filteredUsers(){const s=$('userSearch').value.trim().toLowerCase(),f=$('userStatus').value;return users.filter(x=>(!f||String(x.accessStatus||'').toLowerCase()===f)&&(!s||String(x.email||'').toLowerCase().includes(s)||String(x.username||x.displayName||'').toLowerCase().includes(s)));}
function renderUsers(){const rows=filteredUsers();$('usersBody').innerHTML=rows.length?rows.map(x=>{const st=String(x.accessStatus||'pending').toLowerCase();return `<tr><td>${esc(fmtDate(x.requestedAt||x.createdAt))}</td><td>${esc(x.username||x.displayName||'')}</td><td>${esc(x.email||'')}</td><td class="status ${esc(st)}">${esc(st.toUpperCase())}</td><td>${esc(fmtDate(x.accessUpdatedAt||x.approvedAt||x.updatedAt))}</td><td><div class="actions">${st!=='approved'?`<button class="approve" data-id="${esc(x.id)}" data-action="approve">APPROVE</button>`:''}${st!=='rejected'?`<button class="reject" data-id="${esc(x.id)}" data-action="reject">REJECT</button>`:''}${st==='approved'?`<button class="revoke" data-id="${esc(x.id)}" data-action="revoke">REVOKE</button>`:''}</div></td></tr>`}).join(''):'<tr><td colspan="6">No access requests found.</td></tr>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>changeAccess(b));}
async function changeAccess(btn){const uid=btn.dataset.id,action=btn.dataset.action;if(!confirm(action.toUpperCase()+" this student's Mock Test access?"))return;btn.disabled=true;try{const status=action==='approve'?'approved':action==='reject'?'rejected':'revoked';const data={accessStatus:status,accessUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),approvedBy:String(auth.currentUser&&auth.currentUser.email||'')};if(status==='approved')data.approvedAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('users').doc(uid).update(data);await loadUsers();}catch(e){alert('Action failed: '+(e.message||e)+'\n\nFirestore Rules Publish गरिएको छ कि छैन जाँच्नुहोस्।');}finally{btn.disabled=false;}}
async function loadAttempts(){$('refreshAttempts').disabled=true;try{const s=await db.collection('testAttempts').orderBy('submittedAt','desc').limit(500).get();attempts=s.docs.map(d=>({id:d.id,...d.data()}));renderAttempts();}catch(e){try{const s=await db.collection('testAttempts').limit(500).get();attempts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>toMs(b.submittedAt)-toMs(a.submittedAt));renderAttempts();}catch(e2){alert('Attempts load failed: '+(e2.message||e2));}}finally{$('refreshAttempts').disabled=false;}}
function filteredAttempts(){const s=$('attemptSearch').value.trim().toLowerCase(),f=$('resultFilter').value;return attempts.filter(x=>(!f||x.result===f)&&(!s||String(x.email||'').toLowerCase().includes(s)||String(x.username||'').toLowerCase().includes(s)));}
function renderAttempts(){const rows=filteredAttempts(),emails=new Set(attempts.map(x=>String(x.email||'').toLowerCase()).filter(Boolean));$('totalAttempts').textContent=attempts.length;$('uniqueUsers').textContent=emails.size;$('passed').textContent=attempts.filter(x=>x.result==='PASS').length;$('failed').textContent=attempts.filter(x=>x.result==='FAIL').length;$('attemptsBody').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(fmtDate(x.submittedAt||x.startedAt))}</td><td>${esc(x.username||'')}</td><td>${esc(x.email||'')}</td><td>${esc(x.testId||'')}</td><td><b>${Number(x.score||0)}/250</b></td><td>${Number(x.percentage||0)}%</td><td class="${x.result==='PASS'?'pass':x.result==='FAIL'?'fail':''}">${esc(x.result||x.status||'')}</td><td>${Number(x.correct||0)}</td><td>${Number(x.wrong||0)}</td><td>${Number(x.unanswered||0)}</td><td>${esc(fmtDuration(x.durationSeconds))}</td></tr>`).join(''):'<tr><td colspan="11">No submitted attempts found.</td></tr>';}
function fmtDate(ts){try{return ts&&ts.toDate?ts.toDate().toLocaleString():'-';}catch(e){return '-';}}function toMs(ts){try{return ts&&ts.toMillis?ts.toMillis():0;}catch(e){return 0;}}function fmtDuration(sec){sec=Number(sec||0);return Math.floor(sec/60)+'m '+sec%60+'s';}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function exportCsv(){const cols=['submittedAt','username','email','testId','score','percentage','result','correct','wrong','unanswered','durationSeconds'],lines=[cols.join(',')];filteredAttempts().forEach(x=>{const o={...x,submittedAt:fmtDate(x.submittedAt)};lines.push(cols.map(k=>'"'+String(o[k]||'').replace(/"/g,'""')+'"').join(','));});const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jft-mock-test-attempts.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
init();
})();
</script></body></html>
